<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2732/2732135.png">
    <link rel="manifest" href="manifest.json">
    <title>Buku Kas Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #e2e8f0; --primary: #3b82f6; --income: #10b981; --expense: #ef4444;
            --accent: #f59e0b; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8;
            --border-color: #334155; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); transition: all 0.3s ease; padding-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        /* --- Theme Toggle --- */
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
        /* --- Summary Cards --- */
        .summary-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
        .summary-card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); text-align: center; }
        .summary-card .label { color: var(--text-muted); font-size: 14px; margin-bottom: 8px; }
        .summary-card .value { font-size: 24px; font-weight: 800; }
        .val-balance { color: var(--primary); }
        .val-income { color: var(--income); }
        .val-expense { color: var(--expense); }
        /* --- Cards --- */
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); margin-bottom: 24px; }
        .card h3 { margin-bottom: 16px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        /* --- Voice Input Section --- */
        .voice-section { margin-bottom: 24px; }
        .voice-input-container { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border-radius: 50px; padding: 8px 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .voice-input-container input[type="text"] { flex: 1; border: none; outline: none; background: transparent; width: 1px; font-size: 16px; font-family: inherit; color: var(--text-main); }
        .voice-input-container input::placeholder { color: var(--text-muted); }
        .voice-input-container input::-webkit-input-placeholder { color: var(--text-muted); }
        .voice-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: transform 0.2s; }
        .voice-btn.listening { background: var(--expense); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        /* --- Transaction Form --- */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 16px; }
        .type-toggle { display: flex; gap: 10px; margin-bottom: 16px; }
        .type-btn { flex: 1; padding: 14px; border-radius: 12px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-weight: 600; cursor: pointer; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .type-btn.active.income { border-color: var(--income); background: var(--income); color: white; }
        .type-btn.active.expense { border-color: var(--expense); background: var(--expense); color: white; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: opacity 0.2s; }
        .btn-save { background: var(--income); color: white; margin-top: 8px; }
        .btn-secondary { background: var(--text-muted); color: white; margin-top: 8px; }
        /* --- Category Selector --- */
        .category-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
        .category-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 6px; text-align: center; cursor: pointer; font-size: 11px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; }
        .category-item:hover { background: var(--primary); color: white; }
        .category-item.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .category-item .icon { font-size: 20px; display: block; margin-bottom: 4px; }
        /* --- Filters --- */
        .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .filters input, .filters select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 14px; }
        .filter-full { grid-column: span 2; }
        /* --- Transaction List --- */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .list-header h3 { margin: 0; font-size: 16px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; position: relative; }
        .list-item:hover { background: var(--bg-color); }
        .list-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .list-date { font-size: 12px; color: var(--text-muted); }
        .list-desc { font-weight: 600; font-size: 15px; }
        .list-cat { font-size: 12px; color: var(--text-muted); margin-top: 2px; display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--bg-color); }
        .list-amount { font-weight: 700; font-size: 15px; text-align: right; margin-left: 12px; }
        .amt-income { color: var(--income); }
        .amt-expense { color: var(--expense); }
        .list-actions { display: flex; gap: 8px; margin-left: 12px; opacity: 0; transition: opacity 0.2s; }
        .list-item:hover .list-actions { opacity: 1; }
        .btn-icon { background: none; border: none; padding: 4px; cursor: pointer; font-size: 16px; color: var(--text-muted); }
        /* --- Daily Totals --- */
        .daily-total { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-color); border-radius: 8px; margin-bottom: 4px; }
        .daily-total .date { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .daily-total .amount { font-weight: 700; font-size: 14px; }
        .daily-total.positive { color: var(--income); }
        .daily-total.negative { color: var(--expense); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px; }
        .chart-container { height: 250px; margin-bottom: 20px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none; }
        .mt-20 { margin-top: 20px; }
        .mb-16 { margin-bottom: 16px; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } .card { box-shadow: none; border: 1px solid #ccc; } }
        /* --- Swipe to Delete --- */
        .swipe-wrapper { overflow-x: hidden; }
        .list-item { transform: translateX(0); transition: transform 0.3s ease; }
    </style>
</head>
<body>

<div class="container">
    <header class="no-print">
        <h1>💰 Buku Kas Digital</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Mode Gelap</button>
    </header>

    <!-- Voice Input Section -->
    <div class="voice-section no-print">
        <div class="voice-input-container">
            <input type="text" id="voiceInput" placeholder="mis. bakso 25 ribu kemarin" readonly style="flex: 1; min-width: 0;">
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
                <span id="voiceIcon">🎙️</span>
            </button>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="label">Saldo Total</div>
            <div class="value val-balance" id="sumBalance">Rp 0</div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="summary-card">
                <div class="label">Pemasukan</div>
                <div class="value val-income" id="sumIncome">Rp 0</div>
            </div>
            <div class="summary-card">
                <div class="label">Pengeluaran</div>
                <div class="value val-expense" id="sumExpense">Rp 0</div>
            </div>
        </div>
    </div>

    <!-- Main Chart -->
    <div class="card no-print">
        <h3 id="chartTitle">📊 Analisis Visual</h3>
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <!-- Transaction Form -->
    <div class="card no-print" id="formSection">
        <h3 id="formTitle">➕ Tambah Transaksi</h3>
        <div class="type-toggle" id="typeToggle">
            <button type="button" class="type-btn active income" data-type="income" onclick="setType('income', this)">📈 Pemasukan</button>
            <button type="button" class="type-btn expense" data-type="expense" onclick="setType('expense', this)">📉 Pengeluaran</button>
        </div>
        <form id="txForm" autocomplete="off">
            <input type="hidden" id="txId" value="">
            <input type="hidden" id="txType" value="expense">
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="txDate" required>
            </div>
            <div class="form-group">
                <label>Jumlah (Rp)</label>
                <input type="number" id="txAmount" placeholder="mis. 25 ribu" min="1" required style="font-size: 18px;">
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <div class="category-selector" id="categorySelector"></div>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="txDesc" placeholder="mis. beli bakso">
            </div>
            <button type="submit" class="btn btn-save" id="btnSubmit">Simpan 💾</button>
            <button type="button" class="btn btn-secondary hidden" id="btnCancel" onclick="resetForm()">Batal ✖️</button>
        </form>
    </div>

    <!-- Filters -->
    <div class="card no-print">
        <div class="filters">
            <input type="month" id="filterMonth" class="filter-full">
            <select id="filterType">
                <option value="all">Semua Jenis</option>
                <option value="income">Pemasukan</option>
                <option value="expense">Pengeluaran</option>
            </select>
            <select id="filterCat" class="filter-full">
                <option value="all">Semua Kategori</option>
            </select>
            <input type="text" id="filterSearch" class="filter-full" placeholder="Cari keterangan...">
        </div>
    </div>

    <!-- Header & History -->
    <div class="flex-between mb-16 no-print">
        <h3 style="margin: 0;">📝 Riwayat</h3>
        <button class="theme-toggle" onclick="window.print()">🖨️ Cetak</button>
    </div>

    <!-- Daily Totals Summary -->
    <div class="card" id="dailyTotals"></div>

    <!-- Transaction List (Swipe to Delete) -->
    <div id="txList" class="swipe-wrapper"></div>
</div>

<script>
    // === CONFIG & STATE ===
    const DEFAULT_CATS = [
        { name: 'Makan', icon: '🍜' }, { name: 'Transport', icon: '🚗' },
        { name: 'Belanja', icon: '🛍️' }, { name: 'Listrik/Air', icon: '💡' },
        { name: 'Hiburan', icon: '🎮' }, { name: 'Gaji', icon: '💼' },
        { name: 'Penjualan', icon: '💰' }, { name: 'Lainnya', icon: '📦' }
    ];
    const CAT_MAP = {
        'makan': 'Makan', 'makanan': 'Makan', 'bakso': 'Makan', 'nasi': 'Makan', 'kopi': 'Makan', 'mie': 'Makan',
        'transport': 'Transport', 'bensin': 'Transport', 'taksi': 'Transport', 'parkir': 'Transport', 'ojol': 'Transport',
        'belanja': 'Belanja', 'beli': 'Belanja', 'shopping': 'Belanja', 'belanja': 'Belanja',
        'listrik': 'Listrik/Air', 'air': 'Listrik/Air', 'token': 'Listrik/Air',
        'hiburan': 'Hiburan', 'main': 'Hiburan', 'film': 'Hiburan', 'konser': 'Hiburan', 'game': 'Hiburan',
        'gaji': 'Gaji', 'gajian': 'Gaji',
        'penjualan': 'Penjualan', 'jual': 'Penjualan'
    };
    let entries = [];
    let categories = [];
    let currentTheme = 'light';
    let chartInstance = null;
    let recognition = null;
    let isListening = false;
    let dom = {};

    // === Storage Utilities ===
    function isStorageAvailable() {
        try {
            localStorage.setItem('test_bk', '1');
            localStorage.removeItem('test_bk');
            return true;
        } catch(e) { return false; }
    }
    function loadData() {
        if (isStorageAvailable()) {
            try {
                const stored = localStorage.getItem('bk_entries');
                entries = stored ? JSON.parse(stored) : [];
                const cats = localStorage.getItem('bk_cats');
                categories = cats ? JSON.parse(cats) : DEFAULT_CATS;
                currentTheme = localStorage.getItem('bk_theme') || 'light';
            } catch(e) {
                console.error("Load data error:", e);
                entries = [];
                categories = [...DEFAULT_CATS];
            }
        } else {
            categories = [...DEFAULT_CATS];
        }
    }
    function saveEntries() {
        if (isStorageAvailable()) localStorage.setItem('bk_entries', JSON.stringify(entries));
    }

    // === DOM Utilities ===
    function captureDOM() {
        dom = {
            form: document.getElementById('txForm'),
            list: document.getElementById('txList'),
            daily: document.getElementById('dailyTotals'),
            sumBal: document.getElementById('sumBalance'),
            sumInc: document.getElementById('sumIncome'),
            sumExp: document.getElementById('sumExpense'),
            filterCat: document.getElementById('filterCat'),
            filterMonth: document.getElementById('filterMonth'),
            filterType: document.getElementById('filterType'),
            filterSearch: document.getElementById('filterSearch'),
            btnSubmit: document.getElementById('btnSubmit'),
            btnCancel: document.getElementById('btnCancel'),
            formTitle: document.getElementById('formTitle'),
            voiceInput: document.getElementById('voiceInput'),
            voiceBtn: document.getElementById('voiceBtn'),
            voiceIcon: document.getElementById('voiceIcon'),
            txDate: document.getElementById('txDate'),
            txAmount: document.getElementById('txAmount'),
            txDesc: document.getElementById('txDesc'),
            txType: document.getElementById('txType'),
            categorySelector: document.getElementById('categorySelector')
        };
    }

    // === Theme Management ===
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        if(isStorageAvailable()) localStorage.setItem('bk_theme', theme);
        const btn = document.querySelector('.theme-toggle');
        if(btn) btn.textContent = theme === 'light' ? '🌙 Mode Gelap' : '☀️ Mode Terang';
    }
    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(currentTheme);
    }

    // === Initialization ===
    function setMonthFilter() {
        const now = new Date();
        const month = now.toISOString().substring(0, 7);
        if(dom.filterMonth) dom.filterMonth.value = month;
    }
    function initApp() {
        captureDOM();
        setTheme(currentTheme);
        updateCategorySelectors();
        setMonthFilter();
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];

        if(dom.form) dom.form.onsubmit = handleFormSubmit;
        // Ensure type buttons have active state
        setType('expense', document.querySelector('.type-btn[data-type="expense"]'));

        [dom.filterMonth, dom.filterType, dom.filterCat, dom.filterSearch].forEach(el => {
            if(el) { el.addEventListener('change', render); el.addEventListener('input', render); }
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('SW registered!', reg);
            }).catch(err => console.log('SW registration failed:', err));
        }

        render();
    }
    // Safe startup pattern
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(initApp, 50);
    } else {
        window.addEventListener('DOMContentLoaded', initApp);
    }

    // === Type Toggle ===
    function setType(type, btn) {
        dom.txType.value = type;
        const buttons = document.querySelectorAll('.type-btn');
        buttons.forEach(b => {
            b.classList.remove('active');
            if (b.getAttribute('data-type') === type) {
                if(type === 'income') b.classList.add('active', 'income');
                else b.classList.add('active', 'expense');
            }
        });
    }

    // === Category Management ===
    function updateCategorySelectors() {
        const cats = (categories && categories.length > 0) ? categories : DEFAULT_CATS;
        const selectorHTML = cats.map(c =>
            `<div class="category-item" onclick="selectCategory('${c.name}')" data-cat="${c.name}">
                <span class="icon">${c.icon}</span>
                <span style="font-size:11px; margin-top:2px;">${c.name}</span>
            </div>`
        ).join('');
        dom.categorySelector.innerHTML = selectorHTML;

        const filterHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        dom.filterCat.innerHTML = '<option value="all">Semua Kategori</option>' + filterHTML;
    }
    function selectCategory(cat) {
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('selected'));
        const el = document.querySelector('.category-item[data-cat="' + cat + '"]');
        if(el) el.classList.add('selected');
    }
    function getSelectedCategory() {
        const el = document.querySelector('.category-item.selected');
        return el ? el.getAttribute('data-cat') : '';
    }

    // === Voice Input (Web Speech API) ===
    function toggleVoice() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            return alert('❌ Web Speech API tidak didukung di browser ini.\nCoba pakai Chrome di Android/iOS.');
        }
        if (isListening) {
            stopVoice();
        } else {
            startVoice();
        }
    }
    function startVoice() {
        isListening = true;
        dom.voiceIcon.textContent = '🔴';
        dom.voiceInput.placeholder = 'Mendengarkan...';
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            dom.voiceInput.value = text;
            handleVoiceCommand(text);
        };
        recognition.onerror = (e) => {
            console.error('Voice error:', e);
            alert('❌ Terjadi kesalahan suara: ' + e.error);
        };
        recognition.onend = () => {
            stopVoice();
        };
        recognition.start();
    }
    function stopVoice() {
        isListening = false;
        dom.voiceIcon.textContent = '🎙️';
        dom.voiceInput.placeholder = 'mis. bakso 25 ribu kemarin';
        if (recognition) recognition.stop();
    }

    // === Natural Language Parsing ===
    function handleVoiceCommand(text) {
        const result = parseVoiceCommand(text);
        if (!result) return alert('❌ Tidak dapat memahami perintah suara.\n\nCoba: "bakso 25 ribu kemarin" atau "jual 100 ribu hari ini"');
        dom.txType.value = result.type;
        setType(result.type, document.querySelector('.type-btn[data-type="' + result.type + '"]'));
        if(result.date) dom.txDate.value = result.date;
        if(result.amount) dom.txAmount.value = result.amount;
        if(result.category) selectCategory(result.category);
        if(result.desc) dom.txDesc.value = result.desc;

        alert('✅ Berhasil! ' + (result.type === 'income' ? '📈' : '📉') + ' ' + (result.desc || result.category) + ' - ' + formatRupiah(result.amount));
    }
    function parseVoiceCommand(text) {
        const txt = text.toLowerCase().trim();
        let type = 'expense';
        let amount = 0;
        let category = 'Lainnya';
        let desc = '';
        let date = new Date().toISOString().split('T')[0];

        // Determine type
        if (txt.includes('pemasukan') || txt.includes('masuk') || txt.includes('gaji') || txt.includes('jual') || txt.includes('penjualan') || txt.includes('dapat') || txt.includes('pemasukan')) {
            type = 'income';
        } else if (txt.includes('pengeluaran') || txt.includes('keluar') || txt.includes('beli') || txt.includes('bayar') || txt.includes('belanja') || txt.includes('makan') || txt.includes('bakso')) {
            type = 'expense';
        }

        // Parse amounts: "25 ribu", "1,5 juta", "50000"
        const numberPattern = /(\d+(?:[.,]\d+)?)s*(ribu|juta|ratus|jutaan|ribuan|rub|ratusan|k|rb)?/gi;
        let match;
        while ((match = numberPattern.exec(txt)) !== null) {
            const numStr = match[1].replace(',', '.');
            let num = parseFloat(numStr);
            const unit = match[2] ? match[2].toLowerCase() : '';
            if (unit.startsWith('jut')) num *= 1000000;
            else if (unit.startsWith('rib') || unit === 'rb' || unit === 'r') num *= 1000;
            else if (unit.startsWith('r') || unit === 'k') num *= 100;
            if (num > amount) amount = Math.round(num);
        }
        if (!amount) {
            const numMatch = txt.match(/(\d+)/);
            if (numMatch) amount = parseInt(numMatch[1]);
        }
        amount = amount || 0;

        // Determine date
        const today = new Date();
        if (txt.includes('kemarin')) {
            const d = new Date(today);
            d.setDate(d.getDate() - 1);
            date = d.toISOString().split('T')[0];
        } else if (txt.includes('hari ini') || txt.includes('sekarang')) {
            date = today.toISOString().split('T')[0];
        } else if (txt.includes('besok')) {
            const d = new Date(today);
            d.setDate(d.getDate() + 1);
            date = d.toISOString().split('T')[0];
        }

        // Determine category from known keywords
        for (const [key, val] of Object.entries(CAT_MAP)) {
            if (txt.includes(key)) {
                category = val;
                break;
            }
        }

        // Extract description: remove number words and known keywords
        let remaining = txt;
        const keywords = ['kemarin', 'hari', 'ini', 'sekarang', 'besok', 'minggu', 'bulan', 'ribu', 'juta', 'ratus', 'k', 'rb', 'gaji', 'jual', 'beli', 'belanja', 'makan', 'bayar', 'masuk', 'keluar', 'pemasukan', 'pengeluaran', 'transport', 'listrik', 'air', 'token', 'hiburan', 'main', 'film', 'konser', 'game', 'nasi', 'kopi', 'taksi', 'bensin', 'parkir', 'ojol', 'shopping', 'penjualan', 'dapat'];
        keywords.forEach(kw => { remaining = remaining.replace(new RegExp(kw, 'gi'), ''); });
        remaining = remaining.replace(/(\d+(?:[.,]\d+)?)s*/g, '').replace(/[^w\s]/g, '').trim();
        const words = remaining.split(/\s+/).filter(w => w.length > 1);
        if (words.length > 0) desc = words.slice(0, Math.min(words.length, 3)).join(' ');
        if (desc) desc = desc.charAt(0).toUpperCase() + desc.slice(1);

        if (amount === 0) return null;

        return { type, amount, category, desc, date };
    }

    // === Formatting Utilities ===
    function formatRupiah(num) {
        if (isNaN(num) || num === 0) return 'Rp 0';
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
    }

    // === Rendering ===
    function render() {
        if(!dom.filterMonth) return;
        const month = dom.filterMonth.value;
        const type = dom.filterType.value;
        const cat = document.getElementById('filterCat').value;
        const search = (dom.filterSearch.value || '').toLowerCase();

        const filtered = entries
            .filter(e => e.date.startsWith(month) && (type === 'all' || e.type === type) && (cat === 'all' || e.category === cat) && (e.desc || '').toLowerCase().includes(search))
            .sort((a, b) => new Date(b.date) - new Date(a.date));

        let totalInc = 0, totalExp = 0;
        filtered.forEach(e => {
            if (e.type === 'income') totalInc += e.amount;
            else totalExp += e.amount;
        });
        dom.sumInc.textContent = formatRupiah(totalInc);
        dom.sumExp.textContent = formatRupiah(totalExp);
        dom.sumBal.textContent = formatRupiah(totalInc - totalExp);

        // Daily totals summary
        const dailyTotals = {};
        filtered.forEach(e => {
            const d = e.date;
            if (!dailyTotals[d]) dailyTotals[d] = { income: 0, expense: 0 };
            if (e.type === 'income') dailyTotals[d].income += e.amount;
            else dailyTotals[d].expense += e.amount;
        });
        const sortedDates = Object.keys(dailyTotals).sort((a, b) => new Date(b) - new Date(a));
        let dtHTML = '<h3 style="margin-bottom:12px; font-size:16px;">📅 Ringkasan Harian</h3>';
        if (sortedDates.length === 0) {
            dtHTML += '<div style="color:var(--text-muted); text-align:center; padding:20px;">Belum ada catatan</div>';
        } else {
            sortedDates.forEach(d => {
                const t = dailyTotals[d];
                const net = t.income - t.expense;
                const cls = net >= 0 ? 'positive' : 'negative';
                dtHTML += '<div class="daily-total">' +
                    '<span class="date">' + new Date(d).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) + '</span>' +
                    '<span class="amount ' + cls + '">' + (net >= 0 ? '+' : '-') + ' ' + formatRupiah(Math.abs(net)) + '</span>' +
                    '</div>';
            });
        }
        dom.daily.innerHTML = dtHTML;

        // Transaction list
        let listHTML = '';
        if (filtered.length === 0) {
            listHTML = '<div class="empty-state">Tidak ada transaksi.</div>';
        } else {
            filtered.forEach(e => {
                const netColor = e.type === 'income' ? 'amt-income' : 'amt-expense';
                const sign = e.type === 'income' ? '+' : '-';
                listHTML += '<div class="list-item" onclick="editEntry(\'' + e.id + '\')">' +
                    '<div class="list-info">' +
                        '<span class="list-date">' + new Date(e.date).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) + '</span>' +
                        '<span class="list-desc">' + (e.desc || '-') + '</span>' +
                        '<span class="list-cat">' + e.category + '</span>' +
                    '</div>' +
                    '<div style="display:flex; align-items:center;">' +
                        '<div class="list-amount ' + netColor + '">' + sign + ' ' + formatRupiah(e.amount) + '</div>' +
                        '<div class="list-actions no-print">' +
                            '<button class="btn-icon" onclick="editEntry(\'' + e.id + '\'); event.stopPropagation();">✏️</button>' +
                            '<button class="btn-icon" onclick="deleteEntry(\'' + e.id + '\'); event.stopPropagation();">🗑️</button>' +
                        '</div>' +
                    '</div>' +
                    '</div>';
            });
        }
        dom.list.innerHTML = listHTML;

        updateChart(filtered);
    }

    // === Form Handlers ===
    function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('txId').value;
        const entry = {
            id: id || Date.now().toString(),
            date: document.getElementById('txDate').value,
            type: document.getElementById('txType').value,
            amount: parseFloat(document.getElementById('txAmount').value),
            category: getSelectedCategory() || dom.txType.value === 'income' ? (getSelectedCategory() || 'Penjualan') : (getSelectedCategory() || 'Lainnya'),
            desc: document.getElementById('txDesc').value
        };

        if (!entry.date || isNaN(entry.amount) || entry.amount <= 0) {
            return alert("Mohon isi tanggal dan jumlah dengan benar!");
        }

        if (id) {
            const idx = entries.findIndex(x => x.id === id);
            if(idx !== -1) entries[idx] = entry;
        } else {
            entries.push(entry);
        }

        saveEntries();
        resetForm();
        render();
    }

    function deleteEntry(id) {
        if (confirm("Hapus transaksi ini?")) {
            entries = entries.filter(e => e.id !== id);
            saveEntries();
            render();
        }
    }

    function editEntry(id) {
        const e = entries.find(x => x.id === id);
        if(!e) return;
        document.getElementById('txId').value = e.id;
        document.getElementById('txDate').value = e.date;
        document.getElementById('txType').value = e.type;
        document.getElementById('txAmount').value = e.amount;
        document.getElementById('txDesc').value = e.desc;
        setType(e.type, document.querySelector('.type-btn[data-type="' + e.type + '"]'));
        selectCategory(e.category);
        document.getElementById('formTitle').textContent = "✏️ Edit Transaksi";
        document.getElementById('btnSubmit').textContent = "Simpan Perubahan";
        document.getElementById('btnCancel').classList.remove('hidden');
        window.scrollTo({ top: document.getElementById('formSection').offsetTop - 20, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('txForm').reset();
        document.getElementById('txId').value = '';
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('selected'));
        setType('expense', document.querySelector('.type-btn[data-type="expense"]'));
        document.getElementById('formTitle').textContent = "➕ Tambah Transaksi";
        document.getElementById('btnSubmit').textContent = "Simpan 💾";
        document.getElementById('btnCancel').classList.add('hidden');
        setMonthFilter();
    }

    // === Chart.js ===
    function updateChart(filtered) {
        try {
            if (typeof Chart === 'undefined') {
                document.getElementById('chartTitle').textContent = "📊 Grafik Tidak Tersedia (Offline)";
                return;
            }
            const ctx = document.getElementById('mainChart').getContext('2d');
            const catData = {};
            filtered.filter(e => e.type === 'expense').forEach(e => {
                catData[e.category] = (catData[e.category] || 0) + e.amount;
            });
            // Income vs Expense comparison
            let totalInc = 0, totalExp = 0;
            filtered.forEach(e => { if (e.type === 'income') totalInc += e.amount; else totalExp += e.amount; });

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catData).length ? Object.keys(catData) : ['Tidak ada data'],
                    datasets: [{
                        data: Object.values(catData).length ? Object.values(catData) : [1],
                        backgroundColor: ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b', '#10b981', '#6366f1'],
                        borderWidth: 2,
                        borderColor: 'var(--card-bg)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: 'var(--text-main)', font: { size: 12 } } },
                        title: { display: true, text: 'Komposisi Pengeluaran Bulan Ini', color: 'var(--text-main)', font: { size: 15 } }
                    }
                }
            });
        } catch (e) {
            console.error("Chart Error:", e);
            document.getElementById('chartTitle').textContent = "📊 Grafik Tidak Tersedia";
        }
    }

    // === Export Functions ===
    function exportCSV() {
        let csv = "Tanggal,Jenis,Jumlah,Kategori,Keterangan\n";
        entries.forEach(e => {
            csv += e.date + "," + e.type + "," + e.amount + "," + e.category + ",\"" + e.desc + "\"\n";
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'BukuKas_' + new Date().toISOString().slice(0,10) + '.csv');
        a.click();
    }

    function exportJSON() {
        const data = JSON.stringify({ entries, categories });
        const blob = new Blob([data], { type: 'application/json' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'backup_bukukas_' + Date.now() + '.json');
        a.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (data.entries && data.categories) {
                    entries = data.entries;
                    categories = data.categories;
                    if(isStorageAvailable()) {
                        localStorage.setItem('bk_entries', JSON.stringify(entries));
                        localStorage.setItem('bk_cats', JSON.stringify(categories));
                    }
                    updateCategorySelectors();
                    render();
                    alert("Data berhasil dipulihkan!");
                } else {
                    alert("Format file backup tidak sesuai!");
                }
            } catch (err) {
                alert("File JSON tidak valid!\nError: " + err.message);
            }
        };
        reader.readAsText(file);
    }

    // === Execution ===
    loadData();
    initApp();
</script>
</body>
